# Trust Verify — adopts the Flow Agents external trust anchor on this repo
# (ADVISORY phase: reports but does not yet block merges).
#
# On every PR, re-runs this repo's canonical verification FRESH in a clean CI
# environment an agent does not control (`npm run verify`: typecheck, build +
# tests, and the release-tag-ancestry self-test). If a Flow Agents session has
# published delivery/trust.bundle, it also RECONCILES the agent's claimed passes
# against CI's own fresh results and fails on any divergence. When no bundle is
# present, only the fresh verify is enforced (fail-open on bundle absence;
# fail-closed on divergence when present).
#
# To ARM it: add "Trust Verify" as a required, no-bypass status check in this
# repo's branch protection (Settings -> Branches -> main). Until then it runs and
# reports but does not block merges.
#
# Adoption guide: https://github.com/kontourai/flow-agents/blob/main/docs/trust-anchor-adoption.md
name: Trust Verify

on:
  pull_request:

permissions:
  contents: read

jobs:
  trust-verify:
    name: Trust Verify
    outputs:
      failure-summary: ${{ steps.trust-verify.outputs.failure-summary }}
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: the reconciler binds delivery bundles to commits via
      # `git merge-base --is-ancestor`, which cannot walk a shallow clone —
      # with the default depth-1 checkout every committed bundle looks stale
      # in CI (sealed commit never equals the synthetic merge SHA).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Reads the exact pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # The external anchor: re-run our real verify fresh + reconcile any delivered bundle.
      # SHA-pinned (mutable tags are not trusted for a cross-repo action that gates merges).
      - id: trust-verify
        uses: kontourai/flow-agents/.github/actions/trust-verify@b0adbb4a5defdff0b0d2c7641f1735c06dd121e8 # flow-agents @ publishes structured failure summary (#1120)
        with:
          verify-command: "npm run verify"
  trust-advisory-comment:
    if: >-
      ${{ always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    needs: trust-verify
    permissions:
      pull-requests: write
    uses: kontourai/.github/.github/workflows/trust-advisory-comment.yml@e6dfe1bea874266a98059c682c21a6b73ae9c71e
    with:
      check-name: Trust Verify
      details: ${{ needs['trust-verify'].outputs.failure-summary }}
      pr-number: ${{ github.event.pull_request.number }}
      result: ${{ needs['trust-verify'].result }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
